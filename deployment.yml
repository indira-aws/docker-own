apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: 301745146467.dkr.ecr.ap-south-1.amazonaws.com/devops-ecr-6pm:latest
        ports:
        - containerPort: 80
